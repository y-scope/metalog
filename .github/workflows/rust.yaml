name: Rust
on:
  pull_request:
  push:
    branches: [snapshot-mar-28-rust]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Install toolchains and protoc
        run: |
          rustup toolchain install 1.98.0 --profile minimal --component clippy
          rustup toolchain install nightly-2026-08-30 --profile minimal --component rustfmt
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler
      - run: make fmt
      - run: make lint
      - run: make test-storage-image
      - run: cargo test --locked --workspace --all-features -- --test-threads=4
      - run: cargo build --locked --release --bin metalog
