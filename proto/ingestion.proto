syntax = "proto3";
package com.yscope.metalog.coordinator.grpc;
option java_multiple_files = true;
option java_package = "com.yscope.metalog.coordinator.grpc.proto";
option go_package = "github.com/y-scope/metalog/gen/proto/ingestionpb";

// ---------------------------------------------------------------------------
// Dimension types
// ---------------------------------------------------------------------------

message StringDimension {
  string value      = 1;
  int32  max_length = 2;
}

message DimensionValue {
  oneof value {
    StringDimension str       = 1;
    StringDimension str_utf8  = 2;
    int64           int_val   = 3;
    bool            bool_val  = 4;
    double          float_val = 5;
  }
}

message DimEntry {
  string         key   = 1;
  DimensionValue value = 2;
}

// ---------------------------------------------------------------------------
// Aggregation types (ingestion path)
// ---------------------------------------------------------------------------

enum IngestAggType {
  INGEST_AGG_TYPE_INVALID = 0;
  EQ  = 1;  // Equality — exact match filter
  GTE = 2;  // Greater than or equal
  GT  = 3;  // Greater than
  LTE = 4;  // Less than or equal
  LT  = 5;  // Less than
  SUM = 6;  // Summation
  AVG = 7;  // Average
  MIN = 8;  // Minimum
  MAX = 9;  // Maximum
}

message IngestAggEntry {
  string         field        = 1;
  string         qualifier    = 2;
  IngestAggType  agg_type     = 3;
  oneof value {
    int64  int_val   = 4;
    double float_val = 5;
  }
  string alias_column = 6;
}

// ---------------------------------------------------------------------------
// File fields
// ---------------------------------------------------------------------------

message IrFileInfo {
  string clp_ir_storage_backend = 1;
  string clp_ir_bucket          = 2;
  string clp_ir_path            = 3;
  int64  clp_ir_size_bytes      = 4;
}

message ArchiveFileInfo {
  string clp_archive_storage_backend = 1;
  string clp_archive_bucket          = 2;
  string clp_archive_path            = 3;
  int64  clp_archive_created_at      = 4;
  int64  clp_archive_size_bytes      = 5;
}

message FileFields {
  string          state          = 1;
  int64           min_timestamp  = 2;
  int64           max_timestamp  = 3;
  int64           raw_size_bytes = 4;
  int32           record_count   = 5;
  IrFileInfo      ir             = 6;
  ArchiveFileInfo archive        = 7;
  int32           retention_days = 8;
  int64           expires_at     = 9;
}

// ---------------------------------------------------------------------------
// Self-describing key-value escape hatch
// ---------------------------------------------------------------------------

message SelfDescribingEntry {
  string key   = 1;
  string value = 2;
}

// ---------------------------------------------------------------------------
// Sketch types
// ---------------------------------------------------------------------------

message SketchEntry {
  string sketch_key = 1;  // logical field name, e.g. "uuid"
  bytes  data       = 2;  // msgpack-encoded BloomFilterSnapshot
}

// ---------------------------------------------------------------------------
// Top-level record and RPC messages
// ---------------------------------------------------------------------------

message MetadataRecord {
  FileFields                   file               = 1;
  repeated IngestAggEntry      agg                = 2;
  repeated DimEntry            dim                = 3;
  repeated SelfDescribingEntry self_describing_kv = 4;
  repeated SketchEntry         sketch             = 5;
}

message IngestRequest {
  string         table_name = 1;
  MetadataRecord record     = 2;
}

message IngestResponse {
  bool   accepted = 1;
  string error    = 2;
}

service MetadataIngestionService {
  rpc Ingest(IngestRequest) returns (IngestResponse);
}
