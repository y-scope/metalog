[workspace]
resolver = "2"
members = [
    "crates/metalog-types",
    "crates/metalog-encoding",
    "crates/metalog-timeutil",
    "crates/metalog-logutil",
    "crates/metalog-config",
]

[workspace.package]
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/y-scope/metalog"

[workspace.dependencies]
# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rmp-serde = "1"

# Compression
lz4_flex = "0.11"

# Time
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

# Logging
tracing = "0.1"

# Error handling
thiserror = "2"
anyhow = "1"

# YAML
serde_yaml = "0.9"

# System
hostname = "0.4"
which = "7"

# Internal crates
metalog-types = { path = "crates/metalog-types" }
