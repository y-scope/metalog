[workspace]
resolver = "2"
members = [
    "crates/metalog-types",
    "crates/metalog-encoding",
    "crates/metalog-timeutil",
    "crates/metalog-logutil",
    "crates/metalog-config",
    "crates/metalog-db",
    "crates/metalog-metastore",
    "crates/metalog-schema",
]

[workspace.package]
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/y-scope/metalog"

[workspace.dependencies]
# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rmp-serde = "1"

# Compression
lz4_flex = "0.11"

# Time
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

# Logging
tracing = "0.1"

# Error handling
thiserror = "2"
anyhow = "1"

# YAML
serde_yaml = "0.9"

# Async
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "mysql"] }

# Regex
regex = "1"
once_cell = "1"

# Random
rand = "0.8"

# System
hostname = "0.4"
which = "7"

# Internal crates
metalog-types = { path = "crates/metalog-types" }
metalog-config = { path = "crates/metalog-config" }
metalog-db = { path = "crates/metalog-db" }
metalog-metastore = { path = "crates/metalog-metastore" }
metalog-timeutil = { path = "crates/metalog-timeutil" }
metalog-logutil = { path = "crates/metalog-logutil" }
