[workspace]
resolver = "2"
members = [
    "crates/metalog-types",
    "crates/metalog-encoding",
    "crates/metalog-timeutil",
    "crates/metalog-logutil",
    "crates/metalog-config",
    "crates/metalog-db",
    "crates/metalog-metastore",
    "crates/metalog-schema",
    "crates/metalog-proto",
    "crates/metalog-ingestion",
    "crates/metalog-coordinator",
    "crates/metalog-query",
    "crates/metalog-storage",
    "crates/metalog-grpc",
    "crates/metalog-health",
    "crates/metalog-telemetry",
    "crates/metalog-node",
    # Premium crates
    "crates/metalog-aggs",
    "crates/metalog-sketches",
    "crates/metalog-kafka",
    "crates/metalog-ha",
    "crates/metalog-consolidation",
    "crates/metalog-retention",
]

[workspace.package]
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/y-scope/metalog"

[workspace.dependencies]
# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rmp-serde = "1"

# Compression
lz4_flex = "0.11"

# Time
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

# Logging
tracing = "0.1"

# gRPC / Proto
tonic = "0.12"
tonic-build = "0.12"
prost = "0.13"

# SQL parsing
sqlparser = "0.53"

# Error handling
thiserror = "2"
anyhow = "1"

# YAML
serde_yaml = "0.9"

# Async
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "mysql"] }

# Regex
regex = "1"
once_cell = "1"

# Random
rand = "0.8"

# HTTP
axum = "0.8"

# Async traits
async-trait = "0.1"

# CLI
clap = { version = "4", features = ["derive"] }

# Testing
tempfile = "3"

# System
hostname = "0.4"
which = "7"

# Internal crates
metalog-types = { path = "crates/metalog-types" }
metalog-config = { path = "crates/metalog-config" }
metalog-db = { path = "crates/metalog-db" }
metalog-encoding = { path = "crates/metalog-encoding" }
metalog-proto = { path = "crates/metalog-proto" }
metalog-schema = { path = "crates/metalog-schema" }
metalog-ingestion = { path = "crates/metalog-ingestion" }
metalog-coordinator = { path = "crates/metalog-coordinator" }
metalog-query = { path = "crates/metalog-query" }
metalog-storage = { path = "crates/metalog-storage" }
metalog-grpc = { path = "crates/metalog-grpc" }
metalog-health = { path = "crates/metalog-health" }
metalog-telemetry = { path = "crates/metalog-telemetry" }
metalog-node = { path = "crates/metalog-node" }
metalog-metastore = { path = "crates/metalog-metastore" }
metalog-timeutil = { path = "crates/metalog-timeutil" }
metalog-logutil = { path = "crates/metalog-logutil" }
