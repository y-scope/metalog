# Local integration stack. Production uses managed database/object storage and
# an authenticated TLS ingress; see docs/operations/rust-production.md.
services:
  mariadb:
    image: mariadb:10.11
    environment:
      MARIADB_ROOT_PASSWORD: password
      MARIADB_DATABASE: metalog_metastore
    ports:
      - "127.0.0.1:${DB_PORT:-3306}:3306"
    volumes:
      - mariadb-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "localhost", "-uroot", "-ppassword"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      metalog-network:
        aliases: [db]

  minio:
    build:
      context: .
      dockerfile: Dockerfile.minio-test
    image: metalog-minio-test:2025-10-15
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "127.0.0.1:${MINIO_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [metalog-network]

  minio-init:
    image: amazon/aws-cli:2.31.0
    depends_on:
      minio:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_DEFAULT_REGION: us-east-1
      AWS_EC2_METADATA_DISABLED: "true"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - aws --endpoint-url http://minio:9000 s3api head-bucket --bucket logs || aws --endpoint-url http://minio:9000 s3api create-bucket --bucket logs
    networks: [metalog-network]

  coordinator-node:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    depends_on:
      mariadb:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1::9090"
      - "127.0.0.1::8081"
    volumes:
      - ./coordinator-node.yaml:/etc/clp/node.yaml:ro
    stop_grace_period: 90s
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/ready"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks: [metalog-network]
    restart: unless-stopped

volumes:
  mariadb-data:
  minio-data:
networks:
  metalog-network:
    driver: bridge
