services:
  # MariaDB — metadata database
  mariadb:
    image: mariadb:10.6
    environment:
      MARIADB_ROOT_PASSWORD: password
      MARIADB_DATABASE: metalog_metastore
    ports:
      - "3307:3306"
    healthcheck:
      # Use 127.0.0.1 (not localhost) to force TCP — localhost uses Unix socket
      # which responds during the init phase before TCP port 3306 is ready.
      test: ["CMD", "mariadb", "-h", "127.0.0.1", "-P", "3306", "-uroot", "-ppassword", "-e", "SELECT 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s
    networks:
      metalog-network:
        aliases:
          - db

  # Coordinator — runs CoordinatorUnit + gRPC ingestion server
  coordinator:
    build:
      context: ../../..
      dockerfile: integration-tests/stacks/presto/Dockerfile
    command: ["/app/metalog", "serve", "--config", "/etc/clp/node.yaml"]
    volumes:
      - ./config/node.yaml:/etc/clp/node.yaml:ro
    ports:
      - "9091:9091"   # gRPC ingestion
      - "8081:8081"   # health check
    depends_on:
      mariadb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8081/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s
    restart: on-failure
    networks:
      - metalog-network

  # Register test table via admin gRPC API (must run before data-loader)
  table-register:
    build:
      context: ../../..
      dockerfile: integration-tests/stacks/presto/Dockerfile
    entrypoint: ["/app/metalog", "admin", "register-table"]
    command:
      - --addr=coordinator:9091
      - --table=clp_cockroachdb
      - --display-name=CockroachDB Logs
      - --kafka-poller-enabled=false
      - --consolidation-enabled=false
    depends_on:
      coordinator:
        condition: service_healthy
    restart: on-failure
    networks:
      - metalog-network

  # Data loader — sends test records via gRPC ingestion
  data-loader:
    build:
      context: ../../..
      dockerfile: integration-tests/stacks/presto/Dockerfile.loader
    environment:
      GRPC_HOST: coordinator
      GRPC_PORT: "9091"
      TABLE_NAME: clp_cockroachdb
    depends_on:
      table-register:
        condition: service_completed_successfully
    restart: on-failure
    networks:
      - metalog-network

  # API server — gRPC query endpoint
  api-server:
    build:
      context: ../../..
      dockerfile: integration-tests/stacks/presto/Dockerfile
    # Uses Dockerfile ENTRYPOINT ["/app/metalog", "serve"], just override CMD
    command: ["--config", "/etc/clp/node.yaml"]
    ports:
      - "50051:9091"
    volumes:
      - ./config/node.yaml:/etc/clp/node.yaml:ro
    depends_on:
      coordinator:
        condition: service_healthy
    restart: on-failure
    networks:
      - metalog-network

networks:
  metalog-network:
    driver: bridge
