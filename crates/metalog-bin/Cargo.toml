[package]
name = "metalog"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[[bin]]
name = "metalog"
path = "src/main.rs"

[dependencies]
# Base crates
metalog-config = { workspace = true }
metalog-db = { workspace = true }
metalog-node = { workspace = true }
metalog-proto = { workspace = true }

# Premium crates (enterprise edition)
metalog-aggs = { workspace = true }
metalog-sketches = { workspace = true }
metalog-kafka = { workspace = true }
metalog-ha = { workspace = true }
metalog-consolidation = { workspace = true }
metalog-retention = { workspace = true }

# Runtime
clap = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
